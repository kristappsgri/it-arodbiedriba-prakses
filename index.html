<!DOCTYPE html>
<html>
<head>
    <title>Supabase tests</title>
</head>
<body>
    <h1>Testē Supabase</h1>
    <div id="result">Pārbauda...</div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://etjtssfhauiformhndwj.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_p6ZMMKsLPusLG-e3CuFpqw_49pMi9TM';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function test() {
            const { data, error } = await supabase.from('members').select('*');
            
            if (error) {
                document.getElementById('result').innerHTML = '❌ KĻŪDA: ' + error.message;
            } else {
                document.getElementById('result').innerHTML = '✅ DATI: ' + JSON.stringify(data);
            }
        }
        
        test();
    </script>
</body>
</html>
